<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- iPad/タブレットでの拡大防止およびSafe Area（画面端の凹凸）対応 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>動画プレイヤー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
    }

    /* 動画プレイヤー全体コンテナ */
    .player-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    /* 動画本体（画面いっぱいに大きく表示） */
    video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* アスペクト比を維持しつつ画面最大に表示 */
    }

    /* 縦画面時に表示される横画面推奨メッセージ */
    .orientation-notice {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffda6a;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 100;
      pointer-events: none;
      display: none;
      backdrop-filter: blur(4px);
    }

    @media (orientation: portrait) {
      .orientation-notice {
        display: block;
      }
    }

    /* 操作バー（コントロールオーバーレイ） */
    .controls-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
      padding: 20px 24px calc(20px + env(safe-area-inset-bottom)) 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 1;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    /* 自動非表示状態 */
    .controls-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* プログレスバーエリア */
    .progress-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-display {
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      min-width: 45px;
      color: #ddd;
    }

    .seek-bar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.3);
      outline: none;
      cursor: pointer;
    }

    .seek-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #007aff;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    }

    /* 操作ボタン配置 */
    .buttons-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .button-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* iPadのタップに最適な大きめボタン */
    .btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      min-width: 52px;
      min-height: 48px;
      touch-action: manipulation;
    }

    .btn:active {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(0.96);
    }

    .btn-play {
      background: #007aff;
      min-width: 80px;
    }

    .btn-play:active {
      background: #0056b3;
    }
  </style>
</head>
<body>

<div class="player-container" id="playerContainer">
  <!-- 縦画面時の横画面推奨アナウンス -->
  <div class="orientation-notice">📱 横画面（Landscape）での視聴をおすすめします</div>

  <!-- 動画本体 (iOS/iPadOS必須の playsinline 付き) -->
  <video id="video" src="a.mp4" playsinline webkit-playsinline preload="metadata"></video>

  <!-- コントロールバー -->
  <div class="controls-overlay" id="controlsOverlay">
    <!-- 再生バー / 時間表示 -->
    <div class="progress-area">
      <span class="time-display" id="currentTime">0:00</span>
      <input type="range" class="seek-bar" id="seekBar" value="0" min="0" max="100" step="0.1">
      <span class="time-display" id="duration">0:00</span>
    </div>

    <!-- 操作ボタン類 -->
    <div class="buttons-area">
      <div class="button-group">
        <!-- 5秒戻る -->
        <button class="btn" id="btnRewind">⏪ 5秒</button>
        <!-- 再生 / 一時停止 -->
        <button class="btn btn-play" id="btnPlay">再生</button>
        <!-- 5秒進む -->
        <button class="btn" id="btnForward">5秒 ⏩</button>
      </div>

      <div class="button-group">
        <!-- 全画面表示 -->
        <button class="btn" id="btnFullscreen">⛶ 全画面</button>
      </div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const playerContainer = document.getElementById('playerContainer');
  const controlsOverlay = document.getElementById('controlsOverlay');
  const btnPlay = document.getElementById('btnPlay');
  const btnRewind = document.getElementById('btnRewind');
  const btnForward = document.getElementById('btnForward');
  const btnFullscreen = document.getElementById('btnFullscreen');
  const seekBar = document.getElementById('seekBar');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl = document.getElementById('duration');

  let hideControlsTimeout;

  // 秒数を mm:ss 形式に変換
  function formatTime(seconds) {
    if (isNaN(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }

  // 再生 / 一時停止の切替
  function togglePlay() {
    if (video.paused || video.ended) {
      video.play();
      btnPlay.textContent = '一時停止';
    } else {
      video.pause();
      btnPlay.textContent = '再生';
    }
  }

  // 5秒戻る
  function rewind() {
    video.currentTime = Math.max(0, video.currentTime - 5);
    showControls();
  }

  // 5秒進む
  function forward() {
    video.currentTime = Math.min(video.duration, video.currentTime + 5);
    showControls();
  }

  // 時間更新処理
  video.addEventListener('loadedmetadata', () => {
    durationEl.textContent = formatTime(video.duration);
  });

  video.addEventListener('timeupdate', () => {
    currentTimeEl.textContent = formatTime(video.currentTime);
    if (video.duration) {
      seekBar.value = (video.currentTime / video.duration) * 100;
    }
  });

  // シークバー操作
  seekBar.addEventListener('input', () => {
    if (video.duration) {
      video.currentTime = (seekBar.value / 100) * video.duration;
    }
  });

  // ボタンイベント listener
  btnPlay.addEventListener('click', togglePlay);
  btnRewind.addEventListener('click', rewind);
  btnForward.addEventListener('click', forward);

  // 全画面表示 (iPad / PC / Android 対応フォールバック)
  btnFullscreen.addEventListener('click', () => {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (playerContainer.requestFullscreen) {
      playerContainer.requestFullscreen();
    } else if (video.webkitEnterFullscreen) {
      // iPad Safari等用のフォールバック
      video.webkitEnterFullscreen();
    }
  });

  // コントロールUIの自動非表示コントロール
  function showControls() {
    controlsOverlay.classList.remove('hidden');
    clearTimeout(hideControlsTimeout);
    if (!video.paused) {
      hideControlsTimeout = setTimeout(() => {
        controlsOverlay.classList.add('hidden');
      }, 3000); // 3秒操作がなければ非表示
    }
  }

  // 画面タップでコントロールの表示/非表示を切り替え
  playerContainer.addEventListener('click', (e) => {
    // ボタンやシークバーのクリック時は連動させない
    if (e.target.closest('.controls-overlay')) return;
    
    if (controlsOverlay.classList.contains('hidden')) {
      showControls();
    } else {
      controlsOverlay.classList.add('hidden');
    }
  });

  video.addEventListener('play', showControls);
  video.addEventListener('pause', () => {
    controlsOverlay.classList.remove('hidden');
    clearTimeout(hideControlsTimeout);
  });
</script>

</body>
</html>
